<article class="card h-100 shadow-sm">
  <div class="card-body d-flex flex-column">
    <span class="badge text-bg-secondary align-self-start mb-2">Episodio {{ film.episode_id }}</span>
    <h2 class="h5 card-title">{{ film.title }}</h2>
    <p class="mb-1"><strong>Director:</strong> {{ film.director }}</p>
    <p class="text-secondary small">Estreno: {{ film.release_date }}</p>
    <a class="btn btn-outline-primary mt-auto" [routerLink]="['/films', filmId]">
      Ver detalle
    </a>
  </div>
</article>
